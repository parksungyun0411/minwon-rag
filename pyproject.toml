[project]
name = "minwon-rag"
version = "0.1.0"
description = "국민권익위 민원정책 질의응답의 실제 시민 질의로 재는 dense → 하이브리드 → 리랭커 검색 실험"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "박성윤" }]
requires-python = ">=3.10"
dependencies = [
    "rag-eval-harness",
    "httpx>=0.27",
    "kiwipiepy>=0.18",
    "numpy>=1.26",
    "scipy>=1.11",
    "pyyaml>=6",
]

[project.optional-dependencies]
models = ["sentence-transformers>=3.0", "torch>=2.3"]
llm = ["rag-eval-harness[llm]"]
opensearch = ["opensearch-py>=2.4"]

[project.scripts]
minwon = "minwon_rag.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv.sources]
rag-eval-harness = { git = "https://github.com/parksungyun0411/rag-eval-harness", branch = "main" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minwon_rag"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# 한국어 문서 문자열 줄 길이는 포매터에 맡긴다
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["minwon_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
